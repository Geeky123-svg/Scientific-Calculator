<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabari's Scientific Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .calculator {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            width: 420px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .display {
            background: #0f0f1a;
            border-radius: 12px;
            padding: 20px 25px;
            margin-bottom: 20px;
            text-align: right;
            min-height: 100px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .display .expression {
            color: #888;
            font-size: 16px;
            min-height: 24px;
            word-wrap: break-word;
            font-family: 'Consolas', monospace;
        }
        .display .result {
            color: #fff;
            font-size: 36px;
            font-weight: 300;
            min-height: 48px;
            word-wrap: break-word;
            font-family: 'Consolas', monospace;
        }
        .display .error {
            color: #ff6b6b;
            font-size: 18px;
        }
        .sci-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .main-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            padding: 15px 0;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
        }
        button:hover { transform: translateY(-2px); filter: brightness(1.2); }
        button:active { transform: translateY(0); filter: brightness(0.9); }
        .btn-sci {
            background: #16213e;
            color: #6b9fff;
            font-size: 13px;
        }
        .btn-op {
            background: #e67e22;
            color: #fff;
            font-size: 18px;
        }
        .btn-num {
            background: #2d2d44;
            color: #fff;
            font-size: 20px;
        }
        .btn-eq {
            background: #27ae60;
            color: #fff;
            font-size: 22px;
        }
        .btn-clear {
            background: #c0392b;
            color: #fff;
        }
        .btn-func {
            background: #2c3e50;
            color: #ecf0f1;
            font-size: 13px;
        }
        .span-2 { grid-column: span 2; }
    </style>
</head>
<body>
    <div class="calculator">
        <h1 style="color:#fff; text-align:center; font-size:18px; font-weight:500; margin-bottom:16px; letter-spacing:0.5px;">
            Sabari's Calculator: Calculate in style!
        </h1>
        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <div class="sci-buttons">
            <button class="btn-sci" onclick="sciOp('sin')">sin</button>
            <button class="btn-sci" onclick="sciOp('cos')">cos</button>
            <button class="btn-sci" onclick="sciOp('tan')">tan</button>
            <button class="btn-sci" onclick="sciOp('asin')">sin⁻¹</button>
            <button class="btn-sci" onclick="sciOp('acos')">cos⁻¹</button>
            <button class="btn-sci" onclick="sciOp('atan')">tan⁻¹</button>
            <button class="btn-sci" onclick="sciOp('log')">log</button>
            <button class="btn-sci" onclick="sciOp('ln')">ln</button>
            <button class="btn-sci" onclick="sciOp('sqrt')">√</button>
            <button class="btn-sci" onclick="sciOp('cbrt')">∛</button>
            <button class="btn-sci" onclick="sciOp('square')">x²</button>
            <button class="btn-sci" onclick="sciOp('cube')">x³</button>
            <button class="btn-sci" onclick="sciOp('exp')">eˣ</button>
            <button class="btn-sci" onclick="sciOp('tenx')">10ˣ</button>
            <button class="btn-sci" onclick="sciOp('factorial')">x!</button>
            <button class="btn-sci" onclick="sciOp('abs')">|x|</button>
            <button class="btn-sci" onclick="sciOp('inv')">1/x</button>
            <button class="btn-sci" onclick="sciOp('negate')">±</button>
            <button class="btn-sci" onclick="insert('pi')">π</button>
            <button class="btn-sci" onclick="insert('e')">e</button>
        </div>

        <div class="main-buttons">
            <button class="btn-clear" onclick="clearAll()">AC</button>
            <button class="btn-func" onclick="backspace()">⌫</button>
            <button class="btn-op" onclick="insert('%')">%</button>
            <button class="btn-op" onclick="insert('/')">÷</button>

            <button class="btn-num" onclick="insert('7')">7</button>
            <button class="btn-num" onclick="insert('8')">8</button>
            <button class="btn-num" onclick="insert('9')">9</button>
            <button class="btn-op" onclick="insert('*')">×</button>

            <button class="btn-num" onclick="insert('4')">4</button>
            <button class="btn-num" onclick="insert('5')">5</button>
            <button class="btn-num" onclick="insert('6')">6</button>
            <button class="btn-op" onclick="insert('-')">−</button>

            <button class="btn-num" onclick="insert('1')">1</button>
            <button class="btn-num" onclick="insert('2')">2</button>
            <button class="btn-num" onclick="insert('3')">3</button>
            <button class="btn-op" onclick="insert('+')">+</button>

            <button class="btn-num" onclick="insert('0')">0</button>
            <button class="btn-num" onclick="insert('.')">.</button>
            <button class="btn-op" onclick="insert('^')">xʸ</button>
            <button class="btn-eq" onclick="calculate()">=</button>
        </div>
        <div style="text-align:center; color:#666; font-size:13px; margin-top:18px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.05);">
            made using <span style="color:#6b9fff;">OpenCode</span>
        </div>
    </div>

    <script>
        let expression = '';
        let currentValue = '';
        const exprEl = document.getElementById('expression');
        const resultEl = document.getElementById('result');

        function updateDisplay() {
            exprEl.textContent = expression;
            resultEl.textContent = currentValue || '0';
            resultEl.classList.remove('error');
        }

        function insert(val) {
            if (val === 'pi') { currentValue += Math.PI.toString(); expression += '\u03C0'; }
            else if (val === 'e') { currentValue += Math.E.toString(); expression += 'e'; }
            else { currentValue += val; expression += val; }
            updateDisplay();
        }

        function sciOp(op) {
            if (currentValue === '' && op !== 'negate') return;
            const num = parseFloat(currentValue);
            fetch('/calculate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({op, a: num})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    resultEl.textContent = data.error;
                    resultEl.classList.add('error');
                } else {
                    const symbols = {
                        sin:'sin', cos:'cos', tan:'tan', asin:'asin', acos:'acos', atan:'atan',
                        log:'log', ln:'ln', sqrt:'\u221A', cbrt:'\u221B',
                        square:'\u00B2', cube:'\u00B3', exp:'e^', tenx:'10^',
                        factorial:'!', abs:'| |', inv:'1/', negate:'\u00B1'
                    };
                    expression = (symbols[op] || op) + '(' + expression + ')';
                    currentValue = data.result.toString();
                    updateDisplay();
                }
            });
        }

        function calculate() {
            if (currentValue === '') return;
            const tokens = expression.match(/[+\-*/^%]/g);
            const lastToken = tokens ? tokens[tokens.length - 1] : null;
            const ops = {'+':'+','*':'*','/':'/','^':'^','%':'%','\u2212':'-'};
            if (lastToken && lastToken in ops) return;

            const parts = expression.split(/[+\-*/^%]/);
            if (parts.length < 2) {
                try {
                    const num = parseFloat(currentValue);
                    if (!isNaN(num)) resultEl.textContent = num;
                } catch(e) {}
                return;
            }

            const numA = parseFloat(parts[parts.length - 2]);
            const numB = parseFloat(parts[parts.length - 1]);
            const opChar = expression.match(/[+\-*/^%]/g).pop();
            const opMap = {'\u2212':'-'};
            const op = opMap[opChar] || opChar;

            if (isNaN(numA) || isNaN(numB)) return;

            fetch('/calculate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({op, a: numA, b: numB})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    resultEl.textContent = data.error;
                    resultEl.classList.add('error');
                } else {
                    expression = expression + ' =';
                    currentValue = data.result.toString();
                    updateDisplay();
                }
            });
        }

        function clearAll() {
            expression = '';
            currentValue = '';
            updateDisplay();
            resultEl.classList.remove('error');
        }

        function backspace() {
            currentValue = currentValue.slice(0, -1);
            expression = expression.slice(0, -1);
            updateDisplay();
        }
    </script>
</body>
</html>
